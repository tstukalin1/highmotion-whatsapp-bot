name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  lint-and-test:
    name: Lint & Test (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ruff linter
        run: |
          ruff check app/ tests/ --output-format=github

      - name: Run ruff formatter check
        run: |
          ruff format --check app/ tests/

      - name: Run pytest with coverage
        env:
          DEV_MODE: "true"
          WHATSAPP_ACCESS_TOKEN: "test_token"
          WHATSAPP_PHONE_NUMBER_ID: "123456789"
          WHATSAPP_VERIFY_TOKEN: "test_verify_token"
          WHATSAPP_APP_SECRET: "test_app_secret"
          ANTHROPIC_API_KEY: "test_key"
          ADMIN_API_TOKEN: "test_admin"
          PAYMENT_WEBHOOK_SECRET: "test_payment_secret"
          BUSINESS_NAME: "Test Tours CI"
          PAYMENT_PROVIDER: "generic"
          PAYMENT_DETAILS: "https://pay.example.com"
          MANAGER_PHONE: "79000000000"
          MANAGER_EMAIL: "ci@example.com"
        run: |
          pytest tests/ \
            --tb=short \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
