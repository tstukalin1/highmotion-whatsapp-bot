version: "3.9"

services:

  # ── WhatsApp AI Bot ──────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # Persist generated Word documents
      - ./bookings:/app/bookings
      # Persist generated QR images
      - ./qr_images:/app/qr_images
      # Persist SQLite database (only used when DATABASE_URL=sqlite:///...)
      - ./whatsapp_bot.db:/app/whatsapp_bot.db
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import httpx; httpx.get('http://localhost:8000/docs').raise_for_status()"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on: []

  # ── Optional: Nginx reverse proxy (uncomment to enable) ─────────────────────
